<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>How Docker works</title>
<meta name="description" content="Interactive explainer of how Docker works on your Linux workstation: shared kernel vs virtual machines, namespaces and cgroups, layered read-only images, bind mounts and port forwarding, isolated Postgres per app, GPU passthrough, and rootful vs rootless setups.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
@font-face{
  font-family:'Instrument Sans';font-style:normal;font-weight:400 700;font-stretch:100%;
  font-display:swap;
  src:url('assets/fonts/instrument-sans-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'Instrument Sans';font-style:normal;font-weight:400 700;font-stretch:100%;
  font-display:swap;
  src:url('assets/fonts/instrument-sans-latin-ext.woff2') format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF;
}

:root{
  --bg:#fbfbfa;
  --panel:#ffffff;
  --panel2:#f2f5f8;
  --line:#dfe5ec;
  --line-strong:#b7c3d0;
  --ink:#0f172a;
  --muted:#5b6b7c;
  --dim:#5e6d7e;
  --chip-bg:#d6d3d1;
  --chip-ink:#3f3f46;

  --accent:#2b6cb0;
  --accent-tint:#2b6cb014;
  --hot:#b45309;
  --hot-tint:#b4530914;
  --good:#15803d;
  --good-tint:#15803d14;
  --bad:#b91c1c;
  --bad-tint:#b91c1c12;
  --sel:#cfe3f5;

  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  --sans:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r:6px;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel2:#1b2129;
    --line:#242a31;
    --line-strong:#3b4650;
    --ink:#e6edf3;
    --muted:#8b949e;
    --dim:#848d97;
    --chip-bg:#333a41;
    --chip-ink:#d3d8dd;

    --accent:#58a6ff;
    --accent-tint:#58a6ff14;
    --hot:#e3b341;
    --hot-tint:#e3b34114;
    --good:#3fb950;
    --good-tint:#3fb95014;
    --bad:#f85149;
    --bad-tint:#f8514912;
    --sel:#1f6feb55;
  }
}

*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
html{scrollbar-color:var(--line-strong) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;border:3px solid var(--bg);}
::-webkit-scrollbar-track{background:transparent;}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;
}
::selection{background:var(--sel);color:var(--ink);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}
input{font:inherit;color:inherit;touch-action:manipulation;}
.mono{font-family:var(--mono);}
.num{font-variant-numeric:tabular-nums;}

.app{width:100vw;height:100vh;display:flex;flex-direction:column;}

/* ---------------- header ---------------- */
.top{
  flex:0 0 auto;display:flex;align-items:baseline;gap:14px;
  padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);
}
.top h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.015em;}
.top .sub{color:var(--muted);font-size:13px;}
.top .p{
  margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--dim);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}

/* ---------------- main ---------------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:288px 1fr;}
.side{grid-column:1;grid-row:1;display:flex;flex-direction:column;min-height:0;background:var(--panel);}
.stage-col{grid-column:2;grid-row:1;display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--line);}
.stage-head{
  flex:0 0 auto;display:flex;align-items:baseline;gap:12px;
  padding:11px 22px 7px;
}
.stage-head h2{font-size:18px;font-weight:600;margin:0;letter-spacing:-.015em;}
.stage-head .meta{
  margin-left:auto;font-size:12px;font-weight:600;padding:1px 7px;border-radius:4px;
  background:var(--chip-bg);color:var(--chip-ink);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.stage{flex:1;min-height:0;overflow:auto;padding:2px 22px 14px;display:flex;flex-direction:column;}
.views{display:flex;flex-direction:column;gap:11px;max-width:880px;width:100%;margin:auto 0;}

/* ---------------- shared pieces ---------------- */
.row{
  display:grid;grid-template-columns:156px 1fr auto;gap:14px;align-items:baseline;
  padding:6px 0;border-bottom:1px solid var(--line);
}
.row:first-child{border-top:1px solid var(--line);}
.row .k{font-family:var(--mono);font-size:12px;color:var(--muted);}
.row .v{color:var(--ink);font-size:13.5px;}
.row .w{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
.row.new .k{color:var(--accent);font-weight:600;}
.row.new .v{font-weight:600;}
.row.good .w{color:var(--good);font-weight:600;}
.row.hot .w{color:var(--hot);font-weight:600;}
.row.bad .w{color:var(--bad);font-weight:600;}

.line{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0;line-height:1.65;max-width:74ch;}
.line b{color:var(--ink);font-weight:600;}
.line .hot{color:var(--hot);font-weight:600;}
.line .acc{color:var(--accent);font-weight:600;}
.line .good{color:var(--good);font-weight:600;}
.line .bad{color:var(--bad);font-weight:600;}

.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px 13px;}
.panel > .ph{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px;
}
.panel > .ph .badge{
  font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;
  background:var(--chip-bg);color:var(--chip-ink);font-variant-numeric:tabular-nums;
}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:start;}

/* ---------------- figures (inline svg) ---------------- */
.fig{width:100%;max-height:166px;height:auto;display:block;overflow:visible;}
.fig text{font-family:var(--mono);font-size:11px;fill:var(--muted);}
.fig .hd{font-family:var(--sans);font-size:12.5px;font-weight:600;fill:var(--ink);}
.fig .lg{font-family:var(--mono);font-size:14px;font-weight:600;fill:var(--ink);}
.fig .sm{font-size:11px;fill:var(--dim);}
.fig .acc{fill:var(--accent);font-weight:600;}
.fig .hot{fill:var(--hot);font-weight:600;}
.fig .good{fill:var(--good);font-weight:600;}
.fig .bad{fill:var(--bad);font-weight:600;}
.fig .box{fill:var(--panel);stroke:var(--line);stroke-width:1;}
.fig .box2{fill:var(--panel2);stroke:var(--line);stroke-width:1;}
.fig .boxa{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2;}
.fig .boxh{fill:var(--hot-tint);stroke:var(--hot);stroke-width:1.2;}
.fig .boxg{fill:var(--good-tint);stroke:var(--good);stroke-width:1.2;}
.fig .boxe{fill:var(--bad-tint);stroke:var(--bad);stroke-width:1.2;}
.fig .wire{stroke:var(--line-strong);stroke-width:1.2;fill:none;}
.fig .wira{stroke:var(--accent);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.fig .wirh{stroke:var(--hot);stroke-width:1.5;fill:none;stroke-linecap:round;}
.fig .wirg{stroke:var(--good);stroke-width:1.5;fill:none;stroke-linecap:round;}
.fig .rail{stroke:var(--line-strong);stroke-width:1;stroke-dasharray:4 4;fill:none;}

/* ---------------- interactive controls inside stage ---------------- */
.ctl-bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
}
.ctl-bar label{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
.ctl-bar .readout{
  margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel2);flex-wrap:wrap;}
.seg button{
  border:0;background:transparent;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);
}
.seg button + button{border-left:1px solid var(--line);}
.seg button.on{background:var(--panel);color:var(--ink);}
.seg button:hover:not(.on){opacity:.8;}

.btn-act{
  background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--r);
  padding:5px 11px;font-size:12px;font-weight:600;color:var(--ink);
}
.btn-act:hover{opacity:.8;border-color:var(--accent);}
.btn-act.on{border-color:var(--accent);background:var(--accent-tint);color:var(--accent);}

/* ---------------- tables ---------------- */
.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;}
.tbl th{
  text-align:left;font-family:var(--sans);font-weight:600;color:var(--muted);font-size:11.5px;
  padding:0 10px 7px 0;border-bottom:1px solid var(--line);
}
.tbl td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line);color:var(--muted);}
.tbl tr:last-child td{border-bottom:0;}
.tbl td.n{color:var(--ink);font-weight:600;}
.tbl td.good{color:var(--good);font-weight:600;}
.tbl td.hot{color:var(--hot);font-weight:600;}
.tbl td.acc{color:var(--accent);font-weight:600;}
.tbl tr.hl td{color:var(--ink);background:var(--accent-tint);}
.tbl tr.hl td:first-child{padding-left:6px;}
.tbl tr.click{cursor:pointer;}
.tbl tr.click:hover td{color:var(--ink);}

/* ---------------- bars ---------------- */
.bars{display:flex;flex-direction:column;gap:7px;}
.bar{display:grid;grid-template-columns:170px 1fr 76px;gap:12px;align-items:center;}
.bar .bl{font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar .bt{height:14px;background:var(--panel2);border-radius:3px;overflow:hidden;}
.bar .bf{
  display:block;height:100%;background:var(--accent);transform-origin:left center;
  transform:scaleX(0);transition:transform .35s cubic-bezier(.16,1,.3,1);
}
.bar .bv{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums;}
.bar.good .bf{background:var(--good);}
.bar.hot .bf{background:var(--hot);}
.bar.bad .bf{background:var(--bad);}

/* ---------------- narration ---------------- */
.narr{flex:0 0 auto;padding:12px 22px 14px;border-top:1px solid var(--line);background:var(--panel);}
.narr p{margin:0;font-size:13.5px;color:var(--muted);max-width:74ch;line-height:1.55;}
.narr b{color:var(--ink);font-weight:600;}

/* ---------------- step list ---------------- */
.side .sh{
  flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;
  padding:14px 16px 8px;font-size:12px;font-weight:600;color:var(--muted);
}
.steps{flex:1;min-height:0;overflow:auto;padding:0 8px 14px;}
.step{
  display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:baseline;width:100%;
  text-align:left;background:transparent;border:1px solid transparent;border-radius:var(--r);
  padding:6px 8px;color:var(--muted);font-size:12.5px;line-height:1.35;
}
.step:hover{color:var(--ink);}
.step .n{font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;}
.step.on{background:var(--bg);border-color:var(--line);color:var(--ink);font-weight:600;}
.step.on .n{color:var(--accent);}

/* ---------------- controls ---------------- */
.controls{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:10px 20px;border-top:1px solid var(--line);background:var(--panel);
}
.ctrl{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 14px;font-size:13px;font-weight:550;transition:opacity .15s ease-out,border-color .15s ease-out;
}
.ctrl:hover:not(:disabled){opacity:.8;border-color:var(--line-strong);}
.ctrl:disabled{opacity:.38;cursor:default;}
.ctrl.play{border-color:var(--good);color:var(--good);}
.prog{flex:1;height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;}
.prog i{
  display:block;height:100%;background:var(--accent);transform-origin:left center;
  transform:scaleX(0);transition:transform .3s cubic-bezier(.16,1,.3,1);
}
.cnt{
  font-size:12px;font-weight:600;padding:1px 7px;border-radius:4px;
  background:var(--chip-bg);color:var(--chip-ink);font-variant-numeric:tabular-nums;white-space:nowrap;
}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
}
@media (max-width:960px){
  body{height:auto;overflow:auto;}
  .app{height:auto;min-height:100vh;}
  .main{display:flex;flex-direction:column;}
  .stage{overflow:visible;}
  .side{border-top:1px solid var(--line);}
  .stage-col{border-left:0;}
  .steps{overflow:visible;}
  .controls{flex-wrap:wrap;}
}
@media (max-width:640px){
  body{font-size:15px;}
  .top{flex-wrap:wrap;gap:6px 12px;}
  .top .p{display:none;}
  .stage-head{padding:12px 14px 8px;}
  .stage{padding:2px 14px 18px;}
  .narr{padding:12px 14px 14px;}
  .row{grid-template-columns:110px 1fr;}
  .row .w{grid-column:2;justify-self:start;}
  .bar{grid-template-columns:120px 1fr 64px;}
}
</style>
</head>
<body>

<svg aria-hidden="true" style="position:absolute;width:0;height:0" focusable="false">
  <defs>
    <marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
      orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="var(--accent)"/></marker>
    <marker id="ar-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
      orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="var(--muted)"/></marker>
    <marker id="ar-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
      orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="var(--hot)"/></marker>
    <marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
      orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="var(--good)"/></marker>
  </defs>
</svg>

<div class="app">

  <header class="top">
    <h1>How Docker works</h1>
    <span class="sub">Containers vs VMs, shared Linux kernel, layered images, and how they map to this workstation.</span>
    <span class="p">Ubuntu 26.04 &middot; kernel 7.0.0-42 &middot; RTX 3090</span>
  </header>

  <main class="main">
    <aside class="side" aria-label="Steps">
      <div class="sh"><span>Concepts</span><span class="cnt" id="stepTotal">8</span></div>
      <div class="steps" id="steps"></div>
    </aside>

    <section class="stage-col">
      <div class="stage-head">
        <h2 id="title"></h2>
        <span class="meta" id="meta"></span>
      </div>
      <div class="stage" id="stage"></div>
      <div class="narr"><p id="narr"></p></div>
    </section>
  </main>

  <footer class="controls">
    <button class="ctrl" id="prev" type="button">Prev</button>
    <button class="ctrl play" id="play" type="button">Play</button>
    <button class="ctrl" id="next" type="button">Next</button>
    <button class="ctrl" id="reset" type="button">Reset</button>
    <div class="prog"><i id="prog"></i></div>
    <span class="cnt" id="cnt">1 / 8</span>
  </footer>
</div>

<script>
/* ---------- helpers ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const txt = (x, y, t, cls = 'sm', anchor = 'start') =>
  `<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${t}</text>`;
const SVG = (vb, body, cls = '') =>
  `<svg class="fig ${cls}" viewBox="${vb}" preserveAspectRatio="xMidYMid meet" role="img">${body}</svg>`;
const box = (x, y, w, h, t, sub = '', cls = 'box', tcls = 'hd') =>
  `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>` +
  txt(x + w/2, y + (sub ? h/2 - 2 : h/2 + 4), t, tcls, 'middle') +
  (sub ? txt(x + w/2, y + h/2 + 13, sub, 'sm', 'middle') : '');
const row = (k, v, w = '', cls = '') =>
  `<div class="row ${cls}"><span class="k">${k}</span><span class="v">${v}</span>` +
  (w ? `<span class="w num">${w}</span>` : '') + `</div>`;
const panel = (head, body, badge = '') =>
  `<div class="panel"><div class="ph"><span>${head}</span>${badge ? `<span class="badge">${badge}</span>` : ''}</div>${body}</div>`;

/* ==================================================================
   Step 1: Your Machine Today (Native Everything)
   ================================================================== */
let stHostFocus = 'node';

const HOST_GROUPS = {
  node: {
    name: '~/Code/* (80 directories)',
    port: ':5173 – :5228',
    detail: 'Most of ~/Code is Vite, React, and Express apps totaling 4.8 GB of node_modules. Every one runs directly against your single global Node binary — upgrading Node on the host upgrades all 80 projects at once.',
    risk: 'Shared global runtime; one system Node upgrade touches every project.',
    cls: 'hot'
  },
  pg: {
    name: 'PostgreSQL 18.6 cluster',
    port: '127.0.0.1:5432',
    detail: 'One native systemd service (postgresql.service) serves moto-pass and any future app. Peer auth on /var/run/postgresql has no jlbroughton role by default, so apps share the cluster and superuser unless isolated by hand.',
    risk: 'Single shared database engine and schema namespace across projects.',
    cls: 'hot'
  },
  ollama: {
    name: 'Ollama LLM daemon',
    port: '127.0.0.1:11434',
    detail: 'Native /usr/local/bin/ollama service talking straight to the NVIDIA driver and RTX 3090 (24 GB VRAM), serving 7 local models (~103 GB on disk, mostly Qwen 27B variants). Fast and zero-overhead where it lives.',
    risk: 'None — native GPU access is already ideal here.',
    cls: 'good'
  },
  comfy: {
    name: '~/comfy/ComfyUI',
    port: '127.0.0.1:8188',
    detail: 'Python virtualenv with PyTorch, CUDA kernels, Wan2.1 + Flux fp8 weights, and custom nodes. Installing one custom node that pins a different torch or numpy version mutates the single environment.',
    risk: 'Fragile Python/CUDA dependency tree; broken pip upgrade requires manual rollback.',
    cls: 'hot'
  }
};

function viewHostToday(){
  return `
    <div class="ctl-bar">
      <label>Inspect workload on this machine</label>
      <div class="seg" id="hostSeg">
        <button type="button" data-k="node" class="${stHostFocus==='node'?'on':''}">80 ~/Code Apps</button>
        <button type="button" data-k="pg" class="${stHostFocus==='pg'?'on':''}">Postgres 18 (:5432)</button>
        <button type="button" data-k="ollama" class="${stHostFocus==='ollama'?'on':''}">Ollama (:11434)</button>
        <button type="button" data-k="comfy" class="${stHostFocus==='comfy'?'on':''}">ComfyUI (:8188)</button>
      </div>
      <span class="readout" id="hostReadout"></span>
    </div>
    <div id="hostFig"></div>
    <div class="grid2">
      <div id="hostDetail"></div>
      ${panel('Measured on this computer', [
        row('OS / Kernel', 'Ubuntu 26.04 LTS · Linux 7.0.0-42-generic', 'native'),
        row('CPU / Memory', '16 cores · 61 GiB RAM (55 GiB available)', '9% used', 'good'),
        row('Root filesystem', '/dev/mapper/ubuntu--vg-ubuntu--lv (913 GB)', '627 GB free', 'good'),
        row('GPU', 'NVIDIA GeForce RTX 3090', '24,576 MiB', 'good'),
        row('Docker status', 'No docker, podman, or lxc binary installed', 'absent')
      ].join(''), 'bare metal')}
    </div>
  `;
}

function afterHostToday(){
  const seg = document.querySelectorAll('#hostSeg button');
  function paint(){
    const g = HOST_GROUPS[stHostFocus];
    document.getElementById('hostReadout').textContent = g.port;
    const isN = k => stHostFocus === k;

    const svg = SVG('0 0 820 218', [
      /* shared userland box */
      `<rect class="box2" x="14" y="10" width="792" height="108" rx="6"/>`,
      txt(28, 29, 'Single shared host userland (/usr, /etc, global Node, system libs, /var/run)', 'hd'),

    ].join(''), savedMb + ' MB saved');

/* ---------- navigation & playback ---------- */
let current = -1, isPlaying = false, playTimer = null;
const $ = id => document.getElementById(id);

function buildSteps(){
  $('stepTotal').textContent = STEPS.length;
  $('steps').innerHTML = STEPS.map((s, i) =>
    `<button class="step" type="button" data-step="${i}"><span class="n num">${i+1}</span><span>${esc(s.title)}</span></button>`
  ).join('');
  document.querySelectorAll('.step').forEach(b =>
    b.addEventListener('click', () => { stopPlay(); show(+b.dataset.step); })
  );
}

function show(i){
  if (i < 0 || i >= STEPS.length) return;
  current = i;
  const s = STEPS[i];
  $('title').textContent = s.title;
  $('meta').textContent = 'Step ' + (i + 1) + ' of ' + STEPS.length;
  $('stage').innerHTML = '<div class="views">' + s.view() + '</div>';
  $('stage').scrollTop = 0;
  if (s.after) s.after();
  $('narr').innerHTML = s.narr;
  document.querySelectorAll('.step').forEach(el => {
    el.classList.toggle('on', +el.dataset.step === i);
  });
  const on = document.querySelector('.step.on');
  if (on && on.scrollIntoView) on.scrollIntoView({ block:'nearest' });
  $('cnt').textContent = (i + 1) + ' / ' + STEPS.length;
  $('prog').style.transform = 'scaleX(' + ((i + 1) / STEPS.length) + ')';
  $('prev').disabled = i === 0;
  $('next').disabled = i === STEPS.length - 1;
}

function stopPlay(){
  isPlaying = false;
  if (playTimer) clearTimeout(playTimer);
  playTimer = null;
  $('play').textContent = 'Play';
}
function next(){ if (current < STEPS.length - 1) show(current + 1); }
function prev(){ if (current > 0) show(current - 1); }
function playLoop(){
  if (!isPlaying) return;
  if (current >= STEPS.length - 1){
    playTimer = setTimeout(() => { if (!isPlaying) return; show(0); playTimer = setTimeout(playLoop, 2800); }, 2800);
    return;
  }
  show(current + 1);
  playTimer = setTimeout(playLoop, 2800);
}
function toggle(){
  if (isPlaying){ stopPlay(); return; }
  isPlaying = true;
  $('play').textContent = 'Pause';
  if (current >= STEPS.length - 1) show(0);
  playTimer = setTimeout(playLoop, 500);
}

buildSteps();
$('next').addEventListener('click', () => { stopPlay(); next(); });
$('prev').addEventListener('click', () => { stopPlay(); prev(); });
$('play').addEventListener('click', toggle);
$('reset').addEventListener('click', () => { stopPlay(); show(0); });
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return;
  if (e.key === 'ArrowRight'){ stopPlay(); next(); }
  else if (e.key === 'ArrowLeft'){ stopPlay(); prev(); }
  else if (e.key === ' '){ e.preventDefault(); toggle(); }
});
show(0);
</script>
